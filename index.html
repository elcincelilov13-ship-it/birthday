<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>15 Avqust 2002 ✨</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* =========================
   ÜMUMİ
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    height: 100vh;
    overflow: hidden;

    background:
        radial-gradient(
            ellipse at bottom,
            #172447 0%,
            #090d20 45%,
            #02030a 100%
        );

    color: white;
    font-family: "Montserrat", sans-serif;
}


/* =========================
   ULDUZLU SƏMA
========================= */

.stars,
.stars::before,
.stars::after {
    position: absolute;
    content: "";
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;

    box-shadow:
        5vw 10vh 1px #fff,
        10vw 25vh 1px #fff,
        15vw 70vh 2px #fff,
        20vw 40vh 1px #fff,
        25vw 15vh 2px #fff,
        30vw 80vh 1px #fff,
        35vw 30vh 1px #fff,
        40vw 60vh 2px #fff,
        45vw 20vh 1px #fff,
        50vw 85vh 1px #fff,
        55vw 10vh 2px #fff,
        60vw 45vh 1px #fff,
        65vw 75vh 2px #fff,
        70vw 25vh 1px #fff,
        75vw 55vh 1px #fff,
        80vw 15vh 2px #fff,
        85vw 80vh 1px #fff,
        90vw 35vh 1px #fff,
        95vw 65vh 2px #fff,

        8vw 55vh 1px #fff,
        18vw 90vh 1px #fff,
        28vw 50vh 2px #fff,
        38vw 10vh 1px #fff,
        48vw 40vh 1px #fff,
        58vw 70vh 1px #fff,
        68vw 5vh 2px #fff,
        78vw 90vh 1px #fff,
        88vw 60vh 1px #fff,
        98vw 20vh 2px #fff;
}

.stars::before {
    transform: translate(20vw, 35vh);
    opacity: .6;
}

.stars::after {
    transform: translate(55vw, 15vh);
    opacity: .4;
}


/* =========================
   ƏSAS KONTEYNER
========================= */

.container {
    position: relative;
    z-index: 5;

    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;
    padding: 20px;
}


/* =========================
   TARİX
========================= */

.date {
    position: absolute;
    top: 10%;

    font-family: "Cormorant Garamond", serif;

    font-size: clamp(24px, 4vw, 42px);

    letter-spacing: 10px;

    color: #e8c980;

    text-shadow:
        0 0 15px rgba(232, 201, 128, .3);
}


/* =========================
   BAŞLAT DÜYMƏSİ
========================= */

.start-btn {

    background: transparent;

    border: 1px solid #d8b969;

    color: #f1d58a;

    padding: 18px 65px;

    border-radius: 50px;

    font-size: 14px;

    letter-spacing: 7px;

    cursor: pointer;

    transition: all .4s ease;

    box-shadow:
        0 0 25px rgba(218, 181, 98, .15);

}

.start-btn:hover {

    background: #d8b969;

    color: #060711;

    transform: scale(1.06);

    box-shadow:
        0 0 45px rgba(218, 181, 98, .6);

}


/* =========================
   HEKAYƏ YAZILARI
========================= */

.story {
    display: none;

    width: 100%;
    max-width: 900px;
}

.text {

    font-family: "Cormorant Garamond", serif;

    font-size: clamp(34px, 5vw, 70px);

    font-weight: 400;

    line-height: 1.3;

    color: #ffffff;

    opacity: 0;

    transform: translateY(30px);

    transition:
        opacity 2s ease,
        transform 2s ease;

    text-shadow:
        0 0 20px rgba(255,255,255,.15);
}

.text.show {

    opacity: 1;

    transform: translateY(0);

}


/* =========================
   AXAN ULDUZ
========================= */

.shooting-star {

    position: fixed;

    top: 12%;
    right: -300px;

    width: 5px;
    height: 5px;

    background: white;

    border-radius: 50%;

    opacity: 0;

    z-index: 3;

    box-shadow:
        0 0 10px white,
        0 0 25px white,
        0 0 50px #9ec5ff;
}

.shooting-star::before {

    content: "";

    position: absolute;

    width: 280px;
    height: 2px;

    right: 4px;
    top: 1px;

    background: linear-gradient(
        to left,
        rgba(255,255,255,.9),
        rgba(255,255,255,.3),
        transparent
    );

}

.shooting-star.active {

    animation: shooting 3s ease-out forwards;

}

@keyframes shooting {

    0% {
        opacity: 0;
        transform: translate(0,0);
    }

    10% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform:
            translate(-120vw, 75vh);
    }

}


/* =========================
   FİNAL
========================= */

.final {

    display: none;

    flex-direction: column;

    align-items: center;

    gap: 25px;

    animation: finalAppear 3s ease forwards;

}

.final-title {

    font-family: "Great Vibes", cursive;

    font-size: clamp(70px, 11vw, 140px);

    color: #f1d58a;

    text-shadow:
        0 0 15px rgba(241,213,138,.6),
        0 0 50px rgba(241,213,138,.3);

}

.birthday {

    font-family: "Cormorant Garamond", serif;

    font-size: clamp(30px, 5vw, 60px);

    letter-spacing: 3px;

}

.heart {

    font-size: 35px;

    color: #e8c980;

    animation: heartbeat 2s infinite;

}

@keyframes finalAppear {

    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

@keyframes heartbeat {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.25);
    }

}


/* =========================
   MOBİL
========================= */

@media (max-width: 600px) {

    .date {
        top: 12%;
        letter-spacing: 6px;
    }

    .start-btn {
        padding: 16px 45px;
        letter-spacing: 5px;
    }

}

</style>
</head>

<body>

<!-- ULDUZLAR -->
<div class="stars"></div>

<!-- AXAN ULDUZ -->
<div class="shooting-star" id="shootingStar"></div>


<div class="container">

    <!-- TARİX -->
    <div class="date">
        15 AVQUST 2002
    </div>


    <!-- BAŞLANĞIC -->
    <div id="intro">

        <button class="start-btn" onclick="startStory()">
            BAŞLAT
        </button>

    </div>


    <!-- HEKAYƏ -->
    <div class="story" id="story">

        <div class="text" id="storyText"></div>

    </div>


    <!-- FİNAL -->
    <div class="final" id="final">

        <div class="final-title">
            Yaxşı ki, varsan...
        </div>

        <div class="heart">
            ♡
        </div>

        <div class="birthday">
            Ad günün mübarək
        </div>

    </div>

</div>


<script>

function startStory() {

    const intro = document.getElementById("intro");
    const story = document.getElementById("story");
    const text = document.getElementById("storyText");
    const star = document.getElementById("shootingStar");
    const final = document.getElementById("final");


    /* BAŞLAT DÜYMƏSİNİ GİZLƏT */

    intro.style.opacity = "0";

    setTimeout(() => {

        intro.style.display = "none";

        story.style.display = "block";


        /* ULDUZ AXIR */

        setTimeout(() => {

            star.classList.add("active");

        }, 500);


        /* BİRİNCİ YAZI */

        setTimeout(() => {

            text.innerHTML =
            "Bu, bir ulduzun dünyaya<br>düşməsi də ola bilərdi...";

            text.classList.add("show");

        }, 1800);


        /* BİRİNCİ YAZI GEDİR */

        setTimeout(() => {

            text.classList.remove("show");

        }, 6000);


        /* İKİNCİ YAZI */

        setTimeout(() => {

            text.innerHTML =
            "Ya da bir mələyin<br>yer üzünə gəlməsi...";

            text.classList.add("show");

        }, 8000);


        /* İKİNCİ YAZI GEDİR */

        setTimeout(() => {

            text.classList.remove("show");

        }, 12500);


        /* ÜÇÜNCÜ YAZI */

        setTimeout(() => {

            text.innerHTML =
            "Amma bir şey dəqiqdir...";

            text.classList.add("show");

        }, 14500);


        /* ÜÇÜNCÜ YAZI GEDİR */

        setTimeout(() => {

            text.classList.remove("show");

        }, 18000);


        /* FİNAL */

        setTimeout(() => {

            story.style.display = "none";

            final.style.display = "flex";

        }, 20500);


    }, 800);

}

</script>

</body>
</html>
